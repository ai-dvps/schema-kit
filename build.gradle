plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.0.0'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.2'
    id 'java-library'
}

group = 'com.aidvps.schemakit'
version = '1.1.0'

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

// Common configuration for all modules
subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
    }

    spotless {
        java {
            googleJavaFormat('1.17.0').aosp()
            lineEndings 'UNIX'
        }
    }

    jacoco {
        toolVersion = '0.8.11'
    }

    tasks.named('test') {
        finalizedBy jacocoTestReport
    }

    tasks.named('jacocoTestReport') {
        dependsOn test
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }
}

// Common dependencies
ext {
    junitBomVersion = '5.10.0'
    junitVersion = '5.10.0'
    mockitoVersion = '5.7.0'
    testcontainersVersion = '1.19.2'
}

plugins {
    id 'java-library'
}

dependencies {
    implementation project(':schema-core')
    implementation project(':schema-provider-api')

    // For git operations - use Java 8 compatible version
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.1.202206130422-r'

    // For parsing SQL
    implementation 'com.aidvps:druid-parser:1.2.28-SNAPSHOT'

    // Test dependencies
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Schema Kit Git Provider',
            'Implementation-Version': version,
            'Automatic-Module-Name': 'com.aidvps.schemakit.provider.git'
        )
    }
}
